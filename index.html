<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Torres Builds</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@700;800;900&display=swap');
:root{
  --black:#07080a;--surface:#0f1014;--card:#14161b;--card2:#1a1d24;
  --border:#22252e;--dim:#555c70;--text:#9da3b4;--white:#eef0f5;
  --gold:#c8922a;--gold-bg:rgba(200,146,42,0.08);
  --green:#3db87a;--green-bg:rgba(61,184,122,0.08);
  --red:#e05c5c;--red-bg:rgba(224,92,92,0.08);
  --blue:#4a8ec2;--blue-bg:rgba(74,142,194,0.08);
  --orange:#e8a020;
  --font-d:'Barlow Condensed',sans-serif;
  --font-b:'Inter',sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--black);color:var(--text);font-family:var(--font-b);font-size:14px;overflow:hidden;}
input,select,textarea,button{font-family:var(--font-b);}

/* APP SHELL */
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top);}

/* HEADER */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.brand{font-family:var(--font-d);font-size:22px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--white);}
.brand em{color:var(--gold);font-style:normal;}
.hdr-right{display:flex;gap:8px;align-items:center;}
.icon-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:7px 12px;cursor:pointer;}
.icon-btn.gold{background:var(--gold);border-color:var(--gold);color:#000;font-weight:700;}

/* TABS */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.tab{flex:1;padding:10px 8px;text-align:center;font-size:11px;font-weight:600;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s;letter-spacing:0.5px;text-transform:uppercase;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* MAIN SCROLL */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* SUMMARY CARDS */
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:14px 14px 0;}
.sum-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;}
.sum-card.wide{grid-column:1/-1;}
.sum-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:5px;font-weight:600;}
.sum-val{font-family:var(--font-d);font-size:28px;font-weight:900;line-height:1;color:var(--white);}
.sum-val.green{color:var(--green);}
.sum-val.gold{color:var(--gold);}
.sum-val.blue{color:var(--blue);}
.sum-sub{font-size:10px;color:var(--dim);margin-top:3px;}

/* PIPELINE BAR */
.pipeline{margin:12px 14px 0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;}
.pipeline-title{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:10px;}
.pipeline-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-bottom:8px;}
.pb-seg{border-radius:2px;transition:width 0.5s;}
.pipeline-legend{display:flex;gap:10px;flex-wrap:wrap;}
.pl-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);}
.pl-dot{width:6px;height:6px;border-radius:50%;}

/* SECTION HEADER */
.section-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 8px;}
.section-title{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700;}
.section-count{font-size:10px;color:var(--dim);}

/* JOB CARDS */
.job-list{padding:0 14px;display:flex;flex-direction:column;gap:8px;padding-bottom:20px;}
.job-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color 0.15s;}
.job-card:active{opacity:0.85;}
.job-card.complete{border-left:3px solid var(--green);}
.job-card.in-progress{border-left:3px solid var(--orange);}
.job-card.approved{border-left:3px solid var(--green);}
.job-card.filed{border-left:3px solid var(--blue);}
.job-card.lead,.job-card.inspection{border-left:3px solid var(--dim);}
.jc-main{display:flex;align-items:center;gap:12px;padding:13px 14px;}
.jc-info{flex:1;min-width:0;}
.jc-name{font-family:var(--font-d);font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.jc-meta{font-size:11px;color:var(--dim);margin-top:2px;}
.jc-right{text-align:right;flex-shrink:0;}
.jc-payout{font-family:var(--font-d);font-size:20px;font-weight:800;color:var(--green);}
.jc-payout.pending{color:var(--dim);font-size:13px;}
.phase-pill{font-size:9px;font-weight:700;padding:2px 8px;border-radius:8px;margin-top:3px;display:inline-block;letter-spacing:0.5px;}
.jc-trades{font-size:10px;color:var(--gold);margin-top:1px;}

/* DETAIL SHEET */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:100;display:none;transition:background 0.3s;}
.sheet-overlay.show{display:block;background:rgba(0,0,0,0.75);}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;z-index:101;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.34,1.2,0.64,1);padding-bottom:var(--safe-bot);}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:14px auto 18px;}
.sheet-pad{padding:0 20px 20px;}
.sheet-phase{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:8px;display:inline-block;margin-bottom:10px;}
.sheet-name{font-family:var(--font-d);font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--white);margin-bottom:3px;}
.sheet-sub{font-size:11px;color:var(--dim);margin-bottom:18px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.detail-stat{background:var(--card2);border-radius:10px;padding:11px 13px;}
.ds-label{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:4px;font-weight:600;}
.ds-val{font-size:19px;font-weight:700;color:var(--white);}
.sheet-notes{background:var(--card2);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--text);margin-bottom:14px;line-height:1.5;}
.sheet-btns{display:flex;gap:8px;}
.sbtn{flex:1;border:none;border-radius:9px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.5px;}
.sbtn-gold{background:var(--gold);color:#000;}
.sbtn-dark{background:var(--card2);border:1px solid var(--border);color:var(--text);}
.sbtn-red{background:none;border:1px solid var(--red);color:var(--red);}

/* FORM */
.form-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.form-overlay.show{display:flex;}
.form-card{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:500px;padding:20px 18px calc(20px + var(--safe-bot));max-height:92vh;overflow-y:auto;}
.form-title{font-family:var(--font-d);font-size:20px;font-weight:900;text-transform:uppercase;color:var(--gold);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.fx-btn{background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:11px;}
.fg.row{flex-direction:row;gap:8px;}
.fg.row>.fg{flex:1;margin-bottom:0;}
.lbl{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);font-weight:600;}
.inp{background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--white);font-size:14px;padding:10px 12px;outline:none;width:100%;}
.inp:focus{border-color:var(--gold);}
.sel{background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--white);font-size:14px;padding:10px 12px;outline:none;width:100%;-webkit-appearance:none;}
.trade-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.tc{background:var(--card2);border:2px solid var(--border);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:600;color:var(--dim);cursor:pointer;user-select:none;}
.tc.on{border-color:var(--gold);background:var(--gold-bg);color:var(--gold);}
.form-btns{display:flex;gap:8px;margin-top:6px;}
.fbtn{flex:1;border:none;border-radius:9px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;text-transform:uppercase;}
.fbtn-gold{background:var(--gold);color:#000;}
.fbtn-dark{background:var(--card2);border:1px solid var(--border);color:var(--text);}
.fbtn-red{background:none;border:1px solid var(--red);color:var(--red);}

/* CALCULATOR TAB */
.calc-wrap{padding:14px;}
.calc-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;}
.calc-title{font-family:var(--font-d);font-size:18px;font-weight:800;text-transform:uppercase;color:var(--gold);margin-bottom:16px;letter-spacing:1px;}
.calc-result{background:var(--green-bg);border:1px solid rgba(61,184,122,0.25);border-radius:10px;padding:14px;margin-top:14px;}
.cr-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;}
.cr-row+.cr-row{border-top:1px solid rgba(255,255,255,0.05);}
.cr-label{font-size:11px;color:var(--dim);}
.cr-val{font-size:15px;font-weight:700;color:var(--white);}
.cr-val.big{font-family:var(--font-d);font-size:26px;font-weight:900;color:var(--green);}
.cr-val.red{color:var(--red);}
.cr-val.gold{color:var(--gold);}
.cr-val.pct-good{color:var(--green);}
.cr-val.pct-ok{color:var(--gold);}
.cr-val.pct-bad{color:var(--red);}
.calc-btn{width:100%;background:var(--gold);border:none;color:#000;font-family:var(--font-d);font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:1px;padding:13px;border-radius:9px;cursor:pointer;margin-top:12px;}

/* TROPHY TAB */
.trophy-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;}
.trophy-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;border-left:3px solid var(--green);}
.trophy-card:active{opacity:0.8;}
.tc-icon{font-size:24px;margin-bottom:8px;}
.tc-name{font-family:var(--font-d);font-size:15px;font-weight:800;text-transform:uppercase;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tc-payout{font-size:18px;font-weight:700;color:var(--green);margin-top:3px;}
.tc-date{font-size:10px;color:var(--dim);margin-top:2px;}
.tc-type{font-size:9px;color:var(--gold);margin-top:2px;}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--dim);}
.empty-icon{font-size:40px;opacity:0.3;margin-bottom:12px;}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--safe-bot) + 20px);left:50%;transform:translateX(-50%);background:var(--green);color:#000;font-size:12px;font-weight:700;padding:8px 18px;border-radius:20px;opacity:0;transition:opacity 0.3s;z-index:999;white-space:nowrap;pointer-events:none;}
#toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="brand">Torres <em>Builds</em></div>
    <div class="hdr-right">
      <button class="icon-btn" onclick="openForm(null)">+ Job</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('active')">Active</div>
    <div class="tab" onclick="switchTab('trophy')">Trophy Case</div>
    <div class="tab" onclick="switchTab('calc')">Calculator</div>
  </div>
  <div class="main" id="mainArea"></div>
</div>

<!-- DETAIL SHEET -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
<div class="sheet" id="detailSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-pad" id="sheetContent"></div>
</div>

<!-- FORM -->
<div class="form-overlay" id="formOverlay">
  <div class="form-card">
    <div class="form-title"><span id="form-title">New Job</span><button class="fx-btn" onclick="closeForm()">✕</button></div>
    <div class="fg"><label class="lbl">Client Name *</label><input class="inp" id="f-name" placeholder="Jane Smith"></div>
    <div class="fg"><label class="lbl">Trades</label>
      <div class="trade-wrap">
        <div class="tc on" data-t="Roof" onclick="toggleTrade(this)">🏠 Roof</div>
        <div class="tc" data-t="Gutters" onclick="toggleTrade(this)">🌊 Gutters</div>
        <div class="tc" data-t="Siding" onclick="toggleTrade(this)">🪵 Siding</div>
        <div class="tc" data-t="Concrete" onclick="toggleTrade(this)">🏗 Concrete</div>
        <div class="tc" data-t="Decking" onclick="toggleTrade(this)">🔩 Decking</div>
        <div class="tc" data-t="Handyman" onclick="toggleTrade(this)">🔨 Handyman</div>
      </div>
    </div>
    <div class="fg row">
      <div class="fg"><label class="lbl">Date</label><input class="inp" id="f-date" type="date"></div>
      <div class="fg"><label class="lbl">Phase</label>
        <select class="sel" id="f-phase">
          <option>Lead</option><option>Inspection</option><option>Filed</option>
          <option>Approved</option><option>In Progress</option><option>Complete</option>
        </select>
      </div>
    </div>
    <div class="fg row">
      <div class="fg"><label class="lbl">Contract ($)</label><input class="inp" id="f-contract" type="number" placeholder="0"></div>
      <div class="fg"><label class="lbl">My Payout ($)</label><input class="inp" id="f-payout" type="number" placeholder="0"></div>
    </div>
    <div class="fg row">
      <div class="fg"><label class="lbl">Carrier</label><input class="inp" id="f-carrier" placeholder="State Farm"></div>
      <div class="fg"><label class="lbl">Squares</label><input class="inp" id="f-sq" type="number" placeholder="28"></div>
    </div>
    <div class="fg"><label class="lbl">Notes</label><input class="inp" id="f-notes" placeholder="Storm date, details..."></div>
    <div class="form-btns">
      <button class="fbtn fbtn-gold" onclick="saveJob()">Save</button>
      <button class="fbtn fbtn-red" id="f-del" onclick="deleteJob()" style="display:none">Delete</button>
      <button class="fbtn fbtn-dark" onclick="closeForm()">Cancel</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwifsHA7co0VvAc9FGtEMUyDbqNw2hFL1C67fonDYOy0AlK0YmFAWtCP0ltCV1dkqc/exec';
const PHASES = ['Lead','Inspection','Filed','Approved','In Progress','Complete'];
const PHASE_COLORS = {
  Lead:'#555c70', Inspection:'#c8922a', Filed:'#4a8ec2',
  Approved:'#3db87a', 'In Progress':'#e8a020', Complete:'#3db87a'
};
const ARCH_PRICE=575, METAL_PRICE=850, ARCH_BUILD=244.96, METAL_BUILD=415;

let jobs=[], curTab='active', editingId=null, detailJobId=null;

// ── UTILS ─────────────────────────────────────────────────────────────────────
const fmt = n => '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtS = n => '$'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const fmtK = n => n>=1000?'$'+(n/1000).toFixed(1)+'k':fmtS(n);
const hs = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDate = d => {try{return new Date((d||'')+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return d||'';}}
const normPhase = p => {
  const m={'complete':'Complete','in progress':'In Progress','inprogress':'In Progress',
           'lead':'Lead','inspection':'Inspection','filed':'Filed','approved':'Approved'};
  return m[(p||'').toLowerCase().trim()]||(p||'Lead');
};
const getTypeLabel = t => {
  if(!t)return'Roof';
  const parts=[];
  const tl=t.toLowerCase();
  if(tl.includes('roof'))parts.push('Roof');
  if(tl.includes('gutter'))parts.push('Gutters');
  if(tl.includes('siding'))parts.push('Siding');
  if(tl.includes('concrete'))parts.push('Concrete');
  if(tl.includes('deck')||tl.includes('redeck'))parts.push('Decking');
  if(tl.includes('handyman'))parts.push('Handyman');
  return parts.length?parts.join(' + '):t;
};

// ── DATA ──────────────────────────────────────────────────────────────────────
async function loadJobs(){
  try{
    const r = await fetch(API+'?action=getAll');
    const data = await r.json();
    if(data.jobs&&data.jobs.length){
      jobs = data.jobs.map(j=>({
        id:String(j.id||j.ID||''),
        name:String(j.name||j.Name||''),
        type:String(j.type||j.Type||'Roof'),
        date:String(j.date||j.Date||''),
        phase:normPhase(String(j.phase||j.Phase||'Lead')),
        contract:parseFloat(j.contract||j.Contract)||0,
        payout:parseFloat(j.payout||j.Payout)||0,
        carrier:String(j.carrier||j.Carrier||''),
        notes:String(j.notes||j.Notes||''),
        squares:parseFloat(j.squares||j.Squares)||0,
      }));
      localStorage.setItem('tb_v2',JSON.stringify(jobs));
    } else {
      const c=localStorage.getItem('tb_v2');
      if(c)jobs=JSON.parse(c);
    }
  }catch(e){
    const c=localStorage.getItem('tb_v2');
    if(c)jobs=JSON.parse(c);
  }
  render();
}

async function apiCall(action,data){
  try{await fetch(API,{method:'POST',body:JSON.stringify({action,...data})});}catch(e){}
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function switchTab(tab){
  curTab=tab;
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',['active','trophy','calc'][i]===tab);
  });
  render();
}

function render(){
  if(curTab==='active') renderActive();
  else if(curTab==='trophy') renderTrophy();
  else renderCalc();
}

function renderActive(){
  const active = jobs.filter(j=>j.phase!=='Complete');
  const complete = jobs.filter(j=>j.phase==='Complete');
  const totalCollected = complete.reduce((s,j)=>s+j.payout,0);
  const totalContract = active.reduce((s,j)=>s+j.contract,0);
  const estPayout = active.filter(j=>j.payout>0).reduce((s,j)=>s+j.payout,0);
  const phaseCounts = {};
  PHASES.forEach(p=>phaseCounts[p]=0);
  active.forEach(j=>phaseCounts[j.phase]=(phaseCounts[j.phase]||0)+1);
  const totalActive = active.length;

  // Pipeline bar widths
  const pipePhases = ['Lead','Inspection','Filed','Approved','In Progress'];
  const pipeTotal = pipePhases.reduce((s,p)=>s+(phaseCounts[p]||0),0)||1;

  let html = `<div class="summary">
    <div class="sum-card"><div class="sum-label">Total Collected</div><div class="sum-val green">${fmtK(totalCollected)}</div><div class="sum-sub">from ${complete.length} completed jobs</div></div>
    <div class="sum-card"><div class="sum-label">Active Jobs</div><div class="sum-val gold">${totalActive}</div><div class="sum-sub">${fmtK(totalContract)} open contract</div></div>
    <div class="sum-card"><div class="sum-label">Biggest Job</div><div class="sum-val blue">${fmtK(Math.max(0,...complete.map(j=>j.payout)))}</div><div class="sum-sub">best payout collected</div></div>
    <div class="sum-card"><div class="sum-label">Pending Payout</div><div class="sum-val gold">${fmtK(estPayout)}</div><div class="sum-sub">from active jobs</div></div>
  </div>`;

  // Pipeline
  html += `<div class="pipeline"><div class="pipeline-title">Pipeline</div>
    <div class="pipeline-bar">
      ${pipePhases.map(p=>`<div class="pb-seg" style="flex:${(phaseCounts[p]||0)+0.01};background:${PHASE_COLORS[p]}"></div>`).join('')}
    </div>
    <div class="pipeline-legend">
      ${pipePhases.map(p=>`<div class="pl-item"><div class="pl-dot" style="background:${PHASE_COLORS[p]}"></div>${phaseCounts[p]||0} ${p}</div>`).join('')}
    </div>
  </div>`;

  // Sort: In Progress first, then Approved, Filed, Inspection, Lead
  const order = {'In Progress':0,'Approved':1,'Filed':2,'Inspection':3,'Lead':4};
  const sorted = [...active].sort((a,b)=>(order[a.phase]??5)-(order[b.phase]??5));

  html += `<div class="section-hdr"><div class="section-title">Active Jobs</div><div class="section-count">${totalActive} jobs</div></div>
  <div class="job-list">`;

  if(!sorted.length){
    html += `<div class="empty"><div class="empty-icon">🏗</div><div style="color:var(--white);margin-bottom:6px">No active jobs</div><div>Tap + Job to add one</div></div>`;
  } else {
    sorted.forEach(j=>{
      const pc = PHASE_COLORS[j.phase]||'#555';
      const phaseClass = j.phase.toLowerCase().replace(/\s/g,'-');
      const hasPayout = j.payout>0;
      html += `<div class="job-card ${phaseClass}" onclick="openDetail('${j.id}')">
        <div class="jc-main">
          <div class="jc-info">
            <div class="jc-name">${hs(j.name)}</div>
            <div class="jc-meta">${hs(j.carrier||'')}${j.carrier&&j.date?' · ':''}${fmtDate(j.date)}</div>
            ${j.type&&j.type!=='Roof'?`<div class="jc-trades">${getTypeLabel(j.type)}</div>`:''}
          </div>
          <div class="jc-right">
            ${hasPayout?`<div class="jc-payout">${fmtS(j.payout)}</div>`:`<div class="jc-payout pending">TBD</div>`}
            <span class="phase-pill" style="background:${pc}22;color:${pc}">${j.phase}</span>
          </div>
        </div>
      </div>`;
    });
  }
  html += `</div>`;
  document.getElementById('mainArea').innerHTML = html;
}

function renderTrophy(){
  const complete = jobs.filter(j=>j.phase==='Complete')
    .sort((a,b)=>b.payout-a.payout);
  const totalPayout = complete.reduce((s,j)=>s+j.payout,0);
  const totalContract = complete.reduce((s,j)=>s+j.contract,0);
  const pct = totalContract>0?((totalPayout/totalContract)*100).toFixed(1):0;

  let html = `<div class="summary">
    <div class="sum-card wide"><div class="sum-label">Total Collected</div><div class="sum-val green">${fmt(totalPayout)}</div><div class="sum-sub">${fmt(totalContract)} total contract · ${pct}% avg payout rate</div></div>
  </div>`;

  if(!complete.length){
    html += `<div class="empty"><div class="empty-icon">🏆</div><div style="color:var(--white);margin-bottom:6px">No completed jobs yet</div></div>`;
  } else {
    html += `<div class="section-hdr"><div class="section-title">Completed</div><div class="section-count">${complete.length} jobs</div></div>
    <div class="trophy-grid">`;
    complete.forEach(j=>{
      const icon = j.type&&j.type.toLowerCase().includes('concrete')?'🏗':j.type&&j.type.toLowerCase().includes('handyman')?'🔨':'🏠';
      html += `<div class="trophy-card" onclick="openDetail('${j.id}')">
        <div class="tc-icon">${icon}</div>
        <div class="tc-name">${hs(j.name)}</div>
        <div class="tc-payout">${fmtS(j.payout)}</div>
        <div class="tc-date">${fmtDate(j.date)}</div>
        <div class="tc-type">${getTypeLabel(j.type)}</div>
      </div>`;
    });
    html += `</div>`;
  }
  document.getElementById('mainArea').innerHTML = html;
}

function renderCalc(){
  document.getElementById('mainArea').innerHTML = `
  <div class="calc-wrap">
    <div class="calc-card">
      <div class="calc-title">Job Income Calculator</div>
      <div class="fg row">
        <div class="fg"><label class="lbl">Square Count</label><input class="inp" id="c-sq" type="number" placeholder="28" oninput="calcResult()"></div>
        <div class="fg"><label class="lbl">Shingle Type</label>
          <select class="sel" id="c-type" onchange="calcResult()">
            <option value="arch">Architectural</option>
            <option value="metal">Metal</option>
          </select>
        </div>
      </div>
      <div class="fg row">
        <div class="fg"><label class="lbl">Lead Source</label>
          <select class="sel" id="c-lead" onchange="calcResult()">
            <option value="company">Company Lead (15% O&P)</option>
            <option value="selfgen">Self-Gen (5% O&P)</option>
          </select>
        </div>
        <div class="fg"><label class="lbl">Actual Contract ($)</label>
          <input class="inp" id="c-contract" type="number" placeholder="Optional" oninput="calcResult()">
        </div>
      </div>
      <div id="calc-output"></div>
    </div>
    <div class="calc-card">
      <div class="calc-title">Your Numbers</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        ${jobs.filter(j=>j.phase==='Complete').slice(0,6).map(j=>`
          <div style="background:var(--card2);border-radius:8px;padding:10px;">
            <div style="font-size:10px;color:var(--dim);margin-bottom:3px;">${hs(j.name.split(' ')[0])}</div>
            <div style="font-size:16px;font-weight:700;color:var(--green);">${fmtS(j.payout)}</div>
            <div style="font-size:9px;color:var(--dim);">${fmtS(j.contract)} contract</div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function calcResult(){
  const sq = parseFloat(document.getElementById('c-sq')?.value)||0;
  const type = document.getElementById('c-type')?.value||'arch';
  const lead = document.getElementById('c-lead')?.value||'company';
  const actualContract = parseFloat(document.getElementById('c-contract')?.value)||0;
  if(!sq){document.getElementById('calc-output').innerHTML='';return;}

  const pricePerSq = type==='metal'?METAL_PRICE:ARCH_PRICE;
  const buildPerSq = type==='metal'?METAL_BUILD:ARCH_BUILD;
  const suggestedContract = sq * pricePerSq;
  const contract = actualContract>0?actualContract:suggestedContract;
  const build = sq * buildPerSq;
  const op = lead==='selfgen'?0.05:0.15;
  const opAmt = contract * op;
  const gross = contract - build - opAmt;
  const payout = gross * 0.5;
  const pct = contract>0?((payout/contract)*100):0;
  const pctClass = pct>=20?'pct-good':pct>=12?'pct-ok':'pct-bad';

  document.getElementById('calc-output').innerHTML = `
    <div class="calc-result">
      <div class="cr-row"><span class="cr-label">Suggested Contract</span><span class="cr-val gold">${fmt(suggestedContract)}</span></div>
      ${actualContract>0?`<div class="cr-row"><span class="cr-label">Actual Contract</span><span class="cr-val">${fmt(contract)}</span></div>`:''}
      <div class="cr-row"><span class="cr-label">Build Cost (${sq} sq × $${buildPerSq}/sq)</span><span class="cr-val red">-${fmt(build)}</span></div>
      <div class="cr-row"><span class="cr-label">O&P (${(op*100).toFixed(0)}%)</span><span class="cr-val red">-${fmt(opAmt)}</span></div>
      <div class="cr-row"><span class="cr-label">Gross Margin</span><span class="cr-val">${fmt(gross)}</span></div>
      <div class="cr-row" style="border-top:1px solid rgba(61,184,122,0.3);margin-top:6px;padding-top:10px;">
        <span class="cr-label" style="font-weight:700;color:var(--white)">YOUR PAYOUT</span>
        <span class="cr-val big">${fmt(payout)}</span>
      </div>
      <div class="cr-row"><span class="cr-label">Payout %</span><span class="cr-val ${pctClass}">${pct.toFixed(1)}%</span></div>
    </div>`;
}

// ── DETAIL SHEET ──────────────────────────────────────────────────────────────
function openDetail(id){
  detailJobId=id;
  const j=jobs.find(x=>x.id===id);if(!j)return;
  const pc=PHASE_COLORS[j.phase]||'#555';
  const contract=j.contract||0,payout=j.payout||0;
  const pct=contract>0?((payout/contract)*100).toFixed(1):0;
  const pctColor=parseFloat(pct)>=20?'var(--green)':parseFloat(pct)>=12?'var(--gold)':'var(--dim)';

  document.getElementById('sheetContent').innerHTML = `
    <span class="sheet-phase" style="background:${pc}22;color:${pc}">${j.phase}</span>
    <div class="sheet-name">${hs(j.name)}</div>
    <div class="sheet-sub">${getTypeLabel(j.type)}${j.carrier?' · '+hs(j.carrier):''}${j.date?' · '+fmtDate(j.date):''}</div>
    <div class="detail-grid">
      <div class="detail-stat"><div class="ds-label">Contract</div><div class="ds-val">${contract>0?fmt(contract):'—'}</div></div>
      <div class="detail-stat"><div class="ds-label">My Payout</div><div class="ds-val" style="color:var(--green)">${payout>0?fmt(payout):'Pending'}</div></div>
      <div class="detail-stat"><div class="ds-label">Revenue %</div><div class="ds-val" style="color:${pctColor}">${pct>0?pct+'%':'—'}</div></div>
      <div class="detail-stat"><div class="ds-label">Squares</div><div class="ds-val">${j.squares||'—'}</div></div>
    </div>
    ${j.notes?`<div class="sheet-notes">${hs(j.notes)}</div>`:''}
    <div class="sheet-btns">
      <button class="sbtn sbtn-gold" onclick="openFormFromDetail()">Edit</button>
      <button class="sbtn sbtn-dark" onclick="closeSheet()">Close</button>
    </div>`;

  document.getElementById('sheetOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('detailSheet').classList.add('show'),10);
}

function closeSheet(){
  document.getElementById('detailSheet').classList.remove('show');
  document.getElementById('sheetOverlay').classList.remove('show');
}

function openFormFromDetail(){
  closeSheet();
  setTimeout(()=>openForm(detailJobId),360);
}

// ── FORM ──────────────────────────────────────────────────────────────────────
function toggleTrade(el){el.classList.toggle('on');}
function getSelectedTrades(){return Array.from(document.querySelectorAll('.tc.on')).map(e=>e.dataset.t).join(', ')||'Roof';}
function setTradeChips(type){
  document.querySelectorAll('.tc').forEach(el=>{
    const t=el.dataset.t.toLowerCase();
    el.classList.toggle('on',(type||'roof').toLowerCase().includes(t));
  });
}

function openForm(id){
  editingId=id;
  const j=id?jobs.find(x=>x.id===id):null;
  document.getElementById('form-title').textContent=j?'Edit Job':'New Job';
  document.getElementById('f-name').value=j?.name||'';
  document.getElementById('f-date').value=j?.date||new Date().toISOString().split('T')[0];
  document.getElementById('f-phase').value=j?.phase||'Lead';
  document.getElementById('f-contract').value=j?.contract||'';
  document.getElementById('f-payout').value=j?.payout||'';
  document.getElementById('f-carrier').value=j?.carrier||'';
  document.getElementById('f-sq').value=j?.squares||'';
  document.getElementById('f-notes').value=j?.notes||'';
  document.getElementById('f-del').style.display=j?'block':'none';
  setTradeChips(j?.type||'Roof');
  document.getElementById('formOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('f-name').focus(),300);
}

function closeForm(){document.getElementById('formOverlay').classList.remove('show');}

async function saveJob(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){showToast('Enter a name');return;}
  const job={
    id:editingId||Date.now().toString(),
    name,
    type:getSelectedTrades(),
    date:document.getElementById('f-date').value,
    phase:document.getElementById('f-phase').value,
    contract:parseFloat(document.getElementById('f-contract').value)||0,
    payout:parseFloat(document.getElementById('f-payout').value)||0,
    carrier:document.getElementById('f-carrier').value,
    squares:parseFloat(document.getElementById('f-sq').value)||0,
    notes:document.getElementById('f-notes').value,
  };
  if(editingId){const i=jobs.findIndex(j=>j.id===editingId);if(i>=0)jobs[i]=job;}
  else jobs.unshift(job);
  localStorage.setItem('tb_v2',JSON.stringify(jobs));
  closeForm();render();showToast(editingId?'Job updated ✓':'Job added ✓');
  apiCall('save',job);
}

async function deleteJob(){
  if(!editingId||!confirm('Delete this job?'))return;
  jobs=jobs.filter(j=>j.id!==editingId);
  localStorage.setItem('tb_v2',JSON.stringify(jobs));
  closeForm();render();showToast('Deleted');
  apiCall('delete',{id:editingId});
}

function showToast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

loadJobs();
</script>
